<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Aurora Podcast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f23">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: #6366f1;
      --secondary: #a855f7;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-light: #6b7280;
    }
    .dark-mode {
      --bg: #0f0f23;
      --card: #1a1a2e;
      --text: #ffffff;
      --text-light: #a0a0b0;
    }
    body { 
      font-family: 'Poppins', sans-serif; 
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    .login-container { 
      background: linear-gradient(180deg, #1a1a2e, #0f0f23); 
      border-radius: 32px; 
      padding: 40px 32px; 
      width: 100%; 
      max-width: 400px; 
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .login-logo { 
      width: 100px; height: 100px; 
      background: linear-gradient(135deg, #6366f1, #a855f7, #06b6d4); 
      border-radius: 30px; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 50px; 
      margin: 0 auto 30px; 
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .login-title { color: white; font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 8px; }
    .login-subtitle { color: var(--text-light); font-size: 14px; text-align: center; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 10px; font-weight: 500; }
    .form-group input { 
      width: 100%; padding: 18px 20px; 
      background: #252542; border: 2px solid transparent; 
      border-radius: 16px; font-size: 16px; font-family: inherit; 
      color: white; transition: all 0.3s; 
    }
    .form-group input:focus { outline: none; border-color: var(--primary); }
    .login-btn { 
      width: 100%; padding: 18px; 
      background: linear-gradient(135deg, #6366f1, #a855f7); 
      color: white; border: none; border-radius: 16px; 
      font-size: 17px; font-weight: 700; cursor: pointer; 
      transition: all 0.3s; 
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
    .login-btn:hover { transform: translateY(-3px); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { color: #ef4444; font-size: 13px; padding: 16px; background: rgba(239, 68, 68, 0.1); border-radius: 14px; margin-bottom: 16px; display: none; border: 1px solid rgba(239, 68, 68, 0.2); }
    .success-msg { color: #10b981; font-size: 13px; padding: 16px; background: rgba(16, 185, 129, 0.1); border-radius: 14px; margin-bottom: 16px; display: none; border: 1px solid rgba(16, 185, 129, 0.2); }
    .checking-msg { color: #f59e0b; font-size: 14px; text-align: center; padding: 16px; background: rgba(245, 158, 11, 0.1); border-radius: 14px; margin-bottom: 16px; display: none; border: 1px solid rgba(245, 158, 11, 0.2); }
    .divider { display: flex; align-items: center; margin: 28px 0; color: var(--text-light); font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .divider span { padding: 0 16px; }
    .contact-btn { 
      display: block; width: 100%; padding: 16px; 
      background: linear-gradient(135deg, #25D366, #20BD5A); 
      color: white; border: none; border-radius: 14px; 
      font-size: 15px; font-weight: 600; cursor: pointer; 
      text-align: center; text-decoration: none; 
    }
    .note { 
      background: rgba(255,255,255,0.05); padding: 18px; 
      border-radius: 14px; font-size: 13px; 
      color: var(--text-light); margin-top: 24px; text-align: center; 
      border: 1px solid rgba(255,255,255,0.05);
    }
    .note strong { color: var(--primary-light); }
    
    .popup-overlay { 
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(0,0,0,0.8); z-index: 9999; 
      display: none; align-items: center; justify-content: center;
    }
    .popup-overlay.show { display: flex; }
    .popup-box { 
      background: #1a1a2e; border-radius: 24px; padding: 40px; 
      text-align: center; max-width: 320px; width: 90%; 
      animation: popIn 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }
    @keyframes popIn { 
      from { transform: scale(0.8); opacity: 0; } 
      to { transform: scale(1); opacity: 1; } 
    }
    .popup-icon { font-size: 60px; margin-bottom: 20px; }
    .popup-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    .popup-title.success { color: #10b981; }
    .popup-title.error { color: #ef4444; }
    .popup-message { font-size: 14px; color: #a0a0b0; margin-bottom: 24px; }
    .popup-btn { padding: 14px 32px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .popup-btn.success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .popup-btn.error { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
  </style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-init.js"></script>
</head>
<body>

<div class="login-container">
  <div class="login-logo">🎙️</div>
  <h1 class="login-title">Aurora</h1>
  <p class="login-subtitle">Enter your access key to continue</p>

  <p class="error-msg" id="errorMsg"></p>
  <p class="success-msg" id="successMsg"></p>
  <p class="checking-msg" id="checkingMsg">🔄 Checking key validity...</p>

  <div class="form-group">
    <label>Access Key</label>
    <input type="text" id="accessKey" placeholder="Enter key (e.g., AURORA-2026)" style="text-transform: uppercase;">
  </div>

  <button class="login-btn" id="loginBtn" onclick="loginWithKey()">🔓 Login with Key</button>

  <div class="divider">
    <span>or</span>
  </div>

  <a href="https://wa.me/916305321043?text=Hello, I need an access key for Aurora Podcast." class="contact-btn">
    💬 Request Key via WhatsApp
  </a>

  <div class="note">
    Contact admin to get your access key
  </div>
</div>

<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-icon" id="popupIcon">✅</div>
    <h2 class="popup-title success" id="popupTitle">Access Granted</h2>
    <p class="popup-message" id="popupMessage">Redirecting to home...</p>
    <button class="popup-btn success" id="popupBtn">Continue</button>
  </div>
</div>

<script>
function showChecking() {
  document.getElementById('checkingMsg').style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}

function hideChecking() {
  document.getElementById('checkingMsg').style.display = 'none';
}

function showPopup(type, title, message, callback) {
  const overlay = document.getElementById('popupOverlay');
  const icon = document.getElementById('popupIcon');
  const titleEl = document.getElementById('popupTitle');
  const messageEl = document.getElementById('popupMessage');
  const btn = document.getElementById('popupBtn');
  
  if (type === 'success') {
    icon.textContent = '✅';
    titleEl.textContent = title;
    titleEl.className = 'popup-title success';
    messageEl.textContent = message;
    btn.className = 'popup-btn success';
    btn.onclick = function() {
      closePopup();
      if (callback) callback();
    };
  } else {
    icon.textContent = '❌';
    titleEl.textContent = title;
    titleEl.className = 'popup-title error';
    messageEl.textContent = message;
    btn.className = 'popup-btn error';
    btn.onclick = closePopup;
  }
  
  overlay.classList.add('show');
}

function closePopup() {
  document.getElementById('popupOverlay').classList.remove('show');
}

function getDeviceId() {
  let deviceId = localStorage.getItem('aurora_device_id');
  if (!deviceId) {
    deviceId = 'device_' + Math.random().toString(36).substr(2, 9) + Date.now();
    localStorage.setItem('aurora_device_id', deviceId);
  }
  return deviceId;
}

async function loginWithKey() {
  const key = document.getElementById('accessKey').value.trim().toUpperCase();
  const deviceId = getDeviceId();
  const loginBtn = document.getElementById('loginBtn');

  if (!key) {
    showPopup('error', 'Invalid', 'Please enter your access key');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = '🔄 Checking...';
  showChecking();

  await new Promise(resolve => setTimeout(resolve, 800));

  let storedKeys = JSON.parse(localStorage.getItem('aurora_keys') || '[]');
  let keyData = storedKeys.find(k => k.key === key && k.active);

  if (!keyData && typeof db !== 'undefined' && db) {
    try {
      const snapshot = await db.ref('keys').once('value');
      const firebaseKeys = snapshot.val();
      if (firebaseKeys) {
        const allKeys = Object.values(firebaseKeys);
        keyData = allKeys.find(k => k.key === key && k.active);
        if (keyData) {
          storedKeys.unshift(keyData);
          localStorage.setItem('aurora_keys', JSON.stringify(storedKeys));
        }
      }
    } catch(e) {
      console.log('Firebase key lookup error:', e);
    }
  }

  hideChecking();
  loginBtn.disabled = false;
  loginBtn.textContent = '🔓 Login with Key';

  if (keyData) {
    if (Date.now() > keyData.expiry) {
      showPopup('error', 'Expired', 'Your key has expired. Contact admin for a new key.');
      return;
    }

    if (keyData.deviceId && keyData.deviceId !== deviceId) {
      showPopup('error', 'Already Used', 'This key is already used on another device.');
      return;
    }

    keyData.deviceId = deviceId;
    keyData.usedAt = Date.now();
    keyData.uses = (keyData.uses || 0) + 1;
    localStorage.setItem('aurora_keys', JSON.stringify(storedKeys));

    if (typeof db !== 'undefined' && db) {
      try {
        const snapshot = await db.ref('keys').once('value');
        const firebaseKeys = snapshot.val();
        if (firebaseKeys) {
          const fbKey = Object.keys(firebaseKeys).find(k => firebaseKeys[k].key === key);
          if (fbKey) {
            await db.ref('keys').child(fbKey).update({
              deviceId: deviceId,
              usedAt: keyData.usedAt,
              uses: keyData.uses
            });
          }
        }
      } catch(e) {
        console.log('Firebase update error:', e);
      }
    }

    localStorage.setItem('aurora_key_valid', 'true');
    localStorage.setItem('aurora_key', key);
    localStorage.setItem('aurora_key_expiry', keyData.expiry);
    localStorage.setItem('aurora_user_name', keyData.name || 'User');

    showPopup('success', 'Access Granted', 'Welcome! Redirecting to home...', function() {
      window.location.href = 'index.html';
    });
    
    setTimeout(function() {
      window.location.href = 'index.html';
    }, 1500);
  } else {
    showPopup('error', 'Invalid Key', 'Invalid access key. Contact admin for a valid key.');
  }
}
</script>

</body>
</html>
