<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Downloads - Aurora Podcast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #a855f7;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-light: #6b7280;
      --border: #e5e7eb;
    }
    .dark-mode {
      --bg: #0f0f23;
      --card: #1a1a2e;
      --text: #ffffff;
      --text-light: #a0a0b0;
      --border: #2a2a4a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: 'Poppins', sans-serif; 
      background: var(--bg);
      color: var(--text); 
      padding-bottom: 90px; 
      min-height: 100vh;
    }
    .app { max-width: 480px; margin: 0 auto; padding: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px; }
    header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-icons { display: flex; gap: 8px; }
    .menu-icon, .theme-icon { font-size: 26px; cursor: pointer; padding: 10px; border-radius: 14px; }
    
    .tab-container { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
    .tab { padding: 12px 24px; background: var(--card); border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid transparent; white-space: nowrap; }
    .tab.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; }
    
    .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; margin-top: 20px; }
    .section-title h3 { font-size: 18px; font-weight: 700; }
    
    .episode-item { 
      display: flex; align-items: center; gap: 14px; background: var(--card); 
      padding: 14px; border-radius: 18px; margin-bottom: 12px; 
      border: 1px solid var(--border);
    }
    .episode-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .episode-content { flex: 1; }
    .episode-content h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .episode-content p { font-size: 12px; color: var(--text-light); }
    .episode-actions { display: flex; gap: 8px; }
    .action-btn { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--card-light, #f0f0f0); font-size: 18px; cursor: pointer; }
    
    .empty-state { text-align: center; padding: 40px; color: var(--text-light); }
    .empty-state span { font-size: 50px; display: block; margin-bottom: 15px; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: auto; background: var(--card); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 10px 8px 18px; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); z-index: 100; border-radius: 24px 24px 0 0; border-top: 1px solid var(--border); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 16px; border-radius: 16px; text-decoration: none; color: var(--text-light); font-size: 10px; font-weight: 600; }
    .nav-item.active { color: var(--primary); background: rgba(99,102,241,0.15); }
    .nav-icon { font-size: 24px; }
    
    #drawer { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: var(--card); box-shadow: 10px 0 40px rgba(0,0,0,0.2); padding: 30px; z-index: 1001; }
    #drawer.open { left: 0; }
    #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); opacity: 0; visibility: hidden; z-index: 1000; }
    #overlay.show { opacity: 1; visibility: visible; }
    
    #splash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; }
    .dark-mode #splash { background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%); }
    .light-mode #splash { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%); }
    #splash.hidden { opacity: 0; pointer-events: none; transform: scale(1.1); }
    .splash-content { text-align: center; }
    .splash-logo { width: 100px; height: 100px; background: linear-gradient(135deg, #6366f1, #a855f7, #06b6d4); border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 50px; margin: 0 auto 20px; box-shadow: 0 20px 40px rgba(99,102,241,0.4); animation: float 3s ease-in-out infinite; }
    .splash-title { color: white; font-size: 28px; font-weight: 800; margin-bottom: 6px; }
    .splash-dots { display: flex; gap: 10px; margin-top: 30px; }
    .splash-dot { width: 12px; height: 12px; background: white; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .splash-dot:nth-child(1) { animation-delay: -0.32s; }
    .splash-dot:nth-child(2) { animation-delay: -0.16s; }
    .splash-dot:nth-child(3) { animation-delay: 0s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body class="dark-mode">

<div id="splash" style="display:none;">
  <div class="splash-content">
    <div class="splash-logo">🎙️</div>
    <div class="splash-title">Aurora</div>
    <div class="splash-dots">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
  </div>
</div>

<div class="app">
  <header>
    <span class="menu-icon" onclick="toggleMenu()">☰</span>
    <h1>My Library</h1>
    <span class="theme-icon" onclick="toggleTheme()">☀️</span>
  </header>

  <div class="tab-container">
    <div class="tab active" id="tab-downloads" onclick="switchTab('downloads', this)">⬇️ Downloads</div>
    <div class="tab" id="tab-favorites" onclick="switchTab('favorites', this)">❤️ Favorites</div>
    <div class="tab" id="tab-history" onclick="switchTab('history', this)">🕐 History</div>
  </div>

  <div id="downloadsList">
    <div class="empty-state">
      <span>⬇️</span>
      <p>No downloads yet</p>
    </div>
  </div>

  <div id="favoritesList" style="display:none;">
    <div class="empty-state">
      <span>❤️</span>
      <p>No favorites yet</p>
    </div>
  </div>

  <div id="historyList" style="display:none;">
    <div class="empty-state">
      <span>🕐</span>
      <p>No listening history</p>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠<br><span>Home</span></a>
  <a href="notifications.html" class="nav-item">🔔<br><span>Alerts</span></a>
  <a href="events.html" class="nav-item">📅<br><span>Events</span></a>
  <a href="profile.html" class="nav-item">👤<br><span>Profile</span></a>
</nav>

<!-- Drawer -->
<div id="drawer">
  <div style="display:flex;align-items:center;gap:14px;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--border);">
    <div style="width:56px;height:56px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;">🎙️</div>
    <h3 style="font-size:20px;font-weight:700;">Aurora</h3>
  </div>
  <a href="index.html" style="display:block;padding:14px 0;color:var(--text);text-decoration:none;font-weight:500;">🏠 Home</a>
  <a href="events.html" style="display:block;padding:14px 0;color:var(--text);text-decoration:none;font-weight:500;">📅 Events</a>
  <a href="notifications.html" style="display:block;padding:14px 0;color:var(--text);text-decoration:none;font-weight:500;">🔔 Alerts</a>
  <a href="profile.html" style="display:block;padding:14px 0;color:var(--text);text-decoration:none;font-weight:500;">👤 My Profile</a>
  <a href="contact.html" style="display:block;padding:14px 0;color:var(--text);text-decoration:none;font-weight:500;">📞 Contact</a>
  <a href="login.html" onclick="logout()" style="display:block;padding:14px 0;color:#ef4444;text-decoration:none;font-weight:500;margin-top:20px;">🚪 Logout</a>
</div>
<div id="overlay" onclick="toggleMenu()"></div>

<audio id="libraryPlayer" style="display:none;"></audio>

<script>
var libraryPlayer = document.getElementById('libraryPlayer');
var currentPlayingBtn = null;
var currentPlayingFile = '';

// Tab switching
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  if(el) el.classList.add('active');
  
  document.getElementById('downloadsList').style.display = 'none';
  document.getElementById('favoritesList').style.display = 'none';
  document.getElementById('historyList').style.display = 'none';
  
  if(tab === 'downloads') document.getElementById('downloadsList').style.display = 'block';
  if(tab === 'favorites') document.getElementById('favoritesList').style.display = 'block';
  if(tab === 'history') document.getElementById('historyList').style.display = 'block';
  
  loadData(tab);
}

// Load data from localStorage
function loadData(type) {
  var data = [];
  if(type === 'downloads') data = JSON.parse(localStorage.getItem('aurora_downloads') || '[]');
  if(type === 'favorites') data = JSON.parse(localStorage.getItem('aurora_favorites') || '[]');
  if(type === 'history') data = JSON.parse(localStorage.getItem('aurora_history') || '[]');
  
  var container = document.getElementById(type + 'List');
  
  if(data.length === 0) {
    var icons = {downloads: '⬇️', favorites: '❤️', history: '🕐'};
    var msgs = {downloads: 'No downloads yet', favorites: 'No favorites yet', history: 'No listening history'};
    container.innerHTML = '<div class="empty-state"><span>' + icons[type] + '</span><p>' + msgs[type] + '</p></div>';
    return;
  }
  
  var html = '';
  data.forEach(function(item, index) {
    var audioFile = item.file || item.audio || '';
    var itemId = item.id || item.title || ('item_' + index);
    html += '<div class="episode-item">' +
      '<div class="episode-icon">' + (item.icon || '🎙️') + '</div>' +
      '<div class="episode-content"><h4>' + item.title + ' AUDIO</h4><p>' + (item.source || 'Aurora') + '</p></div>' +
      '<div class="episode-actions">' +
      '<button class="action-btn" id="playbtn_' + itemId + '" onclick="playLibraryItem(\'' + audioFile + '\', \'' + itemId + '\', this)">▶</button>' +
      '<button class="action-btn" onclick="removeItem(\'' + type + '\', \'' + itemId + '\')">🗑️</button>' +
      '</div></div>';
  });
  container.innerHTML = html;
}

// Play item with toggle pause/play
function playLibraryItem(audio, itemId, btn) {
  if(!audio) {
    alert('Audio not available');
    return;
  }
  
  if(currentPlayingFile === audio && !libraryPlayer.paused) {
    libraryPlayer.pause();
    btn.textContent = '▶';
    currentPlayingBtn = null;
    return;
  }
  
  if(currentPlayingBtn) {
    currentPlayingBtn.textContent = '▶';
  }
  
  libraryPlayer.src = audio;
  libraryPlayer.play();
  btn.textContent = '⏸';
  currentPlayingBtn = btn;
  currentPlayingFile = audio;
  
  libraryPlayer.onended = function() {
    btn.textContent = '▶';
    currentPlayingBtn = null;
    currentPlayingFile = '';
  };
}

// Add to history
function addToHistory(item) {
  var history = JSON.parse(localStorage.getItem('aurora_history') || '[]');
  history.unshift({...item, time: new Date().toISOString()});
  if(history.length > 50) history = history.slice(0, 50);
  localStorage.setItem('aurora_history', JSON.stringify(history));
}

// Remove item
function removeItem(type, id) {
  var data = JSON.parse(localStorage.getItem('aurora_' + type) || '[]');
  data = data.filter(function(item) { return (item.id || item.title || 'item_') != id; });
  localStorage.setItem('aurora_' + type, JSON.stringify(data));
  loadData(type);
}

// Theme
function toggleTheme() {
  var body = document.body;
  var btns = document.querySelectorAll('.theme-icon');
  btns.forEach(function(btn) {
    if(body.classList.contains('dark-mode')) {
      body.classList.remove('dark-mode');
      body.classList.add('light-mode');
      btn.textContent = '🌙';
    } else {
      body.classList.remove('light-mode');
      body.classList.add('dark-mode');
      btn.textContent = '☀️';
    }
  });
  localStorage.setItem('aurora_theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
}

// Initialize theme
(function() {
  var theme = localStorage.getItem('aurora_theme') || 'dark';
  var body = document.body;
  var btns = document.querySelectorAll('.theme-icon');
  if(theme === 'light') {
    body.classList.remove('dark-mode');
    body.classList.add('light-mode');
    btns.forEach(function(btn) { btn.textContent = '🌙'; });
  } else {
    body.classList.add('dark-mode');
    btns.forEach(function(btn) { btn.textContent = '☀️'; });
  }
})();

// Auth Check
(function() {
  var hasKey = localStorage.getItem('aurora_key_valid');
  if(hasKey !== 'true') {
    window.location.href = 'login.html';
  }
  // Hide splash on normal navigation
  var splash = document.getElementById('splash');
  if(splash) splash.style.display = 'none';
})();

// Logout - show splash then go to login
function logout() {
  if(confirm('Are you sure you want to logout?')) {
    localStorage.removeItem('aurora_key_valid');
    localStorage.removeItem('aurora_key');
    localStorage.removeItem('aurora_key_expiry');
    localStorage.removeItem('aurora_user_name');
    var splash = document.getElementById('splash');
    if(splash) {
      splash.style.display = 'flex';
      setTimeout(function() {
        window.location.replace('login.html');
      }, 2000);
    } else {
      window.location.replace('login.html');
    }
  }
}

function toggleMenu() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

// Load initial data based on URL parameter
(function() {
  var params = new URLSearchParams(window.location.search);
  var tab = params.get('tab') || 'downloads';
  var tabEl = document.getElementById('tab-' + tab);
  if(tabEl) tabEl.classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t) {
    if(t !== tabEl) t.classList.remove('active');
  });
  switchTab(tab);
})();
</script>

</body>
</html>
